name: Attach a trial build

# A trial build is a way to run the branch on a real PC without cutting a release: the workflow takes
# the Windows package a green CI push run already produced and attaches it to a draft release. A
# draft is visible to the people who can push to the repository, so nothing is distributed publicly
# while the delivery terms in docs/LICENSING.md are still open.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Green PlaneDraft CI push run on this branch whose Windows package becomes the trial
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: planedraft-trial-build
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify the tested revision
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          sha=$(jq -er --arg branch "$GITHUB_REF_NAME" '
            select(.head_repository.full_name == env.GH_REPO and .event == "push" and
                   .path == ".github/workflows/ci.yml" and .head_branch == $branch and
                   .status == "completed" and .conclusion == "success") | .head_sha' <<< "$run")
          # The package has to be this branch's work, and it has to be in what we stand on.
          git merge-base --is-ancestor "$sha" HEAD
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
      - name: Take the package the run produced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n "PlaneDraft-windows-x64-${{ steps.tested.outputs.sha }}" -D dist
          ls -l dist
          # The archive is the deliverable; the inventory and the sums travel beside it.
          test -n "$(find dist -name 'PlaneDraft-*-windows-x64.zip' -print -quit)"
      - name: Attach it to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tested.outputs.sha }}
          SHORT: ${{ steps.tested.outputs.short }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="trial-$SHORT"
          cat > notes.md <<EOF
          Trial build for running this branch on a PC.

          * Revision: $SHA
          * Branch: $BRANCH
          * Package: the portable ZIP and the per-user installer that CI verified on that revision.

          Unpack the ZIP and start PlaneDraft.exe; the DWG converters travel in tools/libredwg/
          beside it. This is a preview of the work on the branch, not a released version, and the
          public delivery terms in docs/LICENSING.md are still open, so the draft stays unpublished.
          EOF
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" --draft --target "$SHA" \
              --title "PlaneDraft trial build $SHORT" --notes-file notes.md
          gh release upload "$tag" --clobber \
            dist/PlaneDraft-*-windows-x64.zip \
            dist/PlaneDraft-*-windows-x64-setup.exe \
            dist/RUNTIME_INVENTORY.md dist/SHA256SUMS
          gh release view "$tag" --json url -q .url
          gh release view "$tag" --json assets -q '.assets[].name'
