; User alias file. Copy to AppConfigLocation/aliases.ini (UTF-8) and restart, or use
;   %APPDATA%\PlaneDraft\aliases.ini            (Windows)
;   ~/.config/PlaneDraft/aliases.ini            (Linux)
; Entries here are merged over the built-in acad.pgp-style table, so a single line overrides one
; alias without losing the rest. Command names themselves cannot be shadowed.
[aliases]
; --- English (built in by default) ---
; L=LINE     PL=PLINE    C=CIRCLE    A=ARC      REC=RECTANG   POL=POLYGON
; M=MOVE     CO=COPY     RO=ROTATE   SC=SCALE    MI=MIRROR     TR=TRIM
; EX=EXTEND  O=OFFSET    F=FILLET    CHA=CHAMFER E=ERASE      H=HATCH
; B=BLOCK    I=INSERT    X=EXPLODE   Z=ZOOM      DI=DIST       AA=AREA
; AR=ARRAY   MA=MATCHPROP
; --- Russian (built in by default) ---
; ОТ=LINE    ПЛ=PLINE    К=CIRCLE    Д=ARC       ПРЯМ=RECTANG  МН=POLYGON
; П=MOVE     КОП=COPY    ПОВ=ROTATE  М=SCALE     ЗЕР=MIRROR    ОБР=TRIM
; УДЛ=EXTEND СМ=OFFSET   СОПР=FILLET ФАС=CHAMFER СТ=ERASE      Ш=HATCH
; Б=BLOCK    ВСТ=INSERT  РАСЧ=EXPLODE З=ZOOM      ДИСТ=DIST     ПЛОЩАДЬ=AREA
; МАССИВ=ARRAY КОПИРОВАТЬСВ=MATCHPROP
; --- Examples of personal overrides ---
; U=UNDO
; R=REDO
; Becomes active when the frame_generator module is loaded.
; F=FRAME
